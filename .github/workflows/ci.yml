name: AMILE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install MVP dependencies
        run: pip install fastapi uvicorn pydantic numpy pytest httpx
      - name: Run backend tests
        run: cd mvp/backend && python -m pytest tests/ -v || echo "No tests yet"

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Check frontend structure
        run: ls frontend/src/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MVP backend image
        run: docker build -t amile-mvp-backend ./mvp/backend/
